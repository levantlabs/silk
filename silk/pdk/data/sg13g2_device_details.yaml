nmos_hv:
  PDKDevice: sg13_hv_nmos
  paramList:
    m: { minval: 1, maxval: -1, resolution: 1 }
    w: { minval: -1, maxval: -1, default: 3.5e-07 , pdk_unit: base }
    l: { minval: -1, maxval: -1, default: 3.4e-07 , pdk_unit: base }
    ng: { minval: 1, maxval: -1, resolution: 1 }
  pinList: { d: drain, g: gate, s: source, b: bulk }
  junction_ratings:
    Vgs_max: 3.3   # TASK-48: was 3.63 (1.1 x 3.3 V nominal, unsourced)
    Vds_max: 3.3   # TASK-48: was 3.63 (1.1 x 3.3 V nominal, unsourced)
    Vgd_max: 3.3   # TASK-48: was 3.63 (1.1 x 3.3 V nominal, unsourced)
    Vbs_max: 3.3   # TASK-48: was 3.63 (1.1 x 3.3 V nominal, unsourced)
    Vbd_max: 3.3   # TASK-48: was 3.63 (1.1 x 3.3 V nominal, unsourced)
  junction_ratings_provenance:
    source: >-
      $PDK_ROOT/ihp_sg13g2/ihp-sg13g2/libs.doc/doc/SG13G2_os_process_spec.pdf
      (IHP, Rev. 1.2, 2023-12-20) section 2.4 HV-NMOS / 2.5 HV-PMOS header:
      "VGS <= 3,3V (Maximum) @ 27°C" -> Vgs_max. The spec publishes no Vds/Vbs
      operating maximum (BVDSS >= 5.3 V is breakdown, not a rating). The model
      SOA parameters in sg13g2_moshv_parm.lib (VGS_MAX = VGD_MAX = VDS_MAX =
      3.0 V, VDB_MAX = VSB_MAX = 1.6 V) are simulator warnings, off by default
      (SWSOA = 0), and are not adopted: 3.0 V and 1.6 V both sit below the 3.3
      V supply the sg13g2_io libraries are characterized at, so they would
      flag every HV device in normal operation.
    heuristic:
      Vds_max: >-
        = Vgs_max; the spec states one operating maximum per device, the gate
        voltage, and no separate Vds limit (see source).
      Vgd_max: >-
        = Vgs_max; the spec states one operating maximum per device, the gate
        voltage, and no separate Vgd limit (see source).
      Vbs_max: >-
        = Vgs_max; the spec states one operating maximum per device, the gate
        voltage, and no separate Vbs limit (see source).
      Vbd_max: >-
        = Vgs_max; the spec states one operating maximum per device, the gate
        voltage, and no separate Vbd limit (see source).
  schemdraw:
    element: NFet
    category: transistor
    terminalMap: { d: drain, g: gate, s: source, b: bulk }

