# GF180MCU device catalog for silk — GENERATED from the installed PDK.
#
# Source: $PDK_ROOT/gf180mcuD/libs.tech/ngspice/sm141064.ngspice
#   (gf180mcuA/B/C/D ship a BYTE-IDENTICAL model file — verified by md5 — so
#    the variant affects the metal stack only, never these models.)
#
# Device names, pin names AND PIN ORDER, and every `default:` below are read
# out of that file's .subckt lines. Nothing here is invented.
#
# `minval: -1` / `maxval: -1` mean silk declares NO limit, not "no limit
# exists". GF180MCU's drawn-W/L design rules are not present in the installed
# tree in machine-readable form, and writing a guessed DRC number into a
# constraint that silk *enforces* would be worse than declaring nothing: it
# would reject legal geometry, or pass illegal geometry, silently. Fill these
# in from the GF180MCU design-rule document before relying on range checking.
#
# `resolution` is likewise omitted rather than guessed.
#
# UNITS — READ THIS BEFORE CHANGING A NUMBER.
#
# W and L here are in **METRES**, not µm. That is not a silk convention, it is
# GF180MCU's: its .subckt lines declare `w=10u l=0.28u` and its models are
# BINNED on W/L in metres. Every W/L below therefore carries `pdk_unit: base`
# — `base` is silk's name for "the SI base unit, no prefix" (see
# basepdk._SI_TO_PDK_SCALE), added precisely so a metres-native PDK could
# declare itself truthfully; `u` would claim µm, which these numbers are NOT.
#
# The `default:` values are in metres too (read straight off the .subckt
# lines) and are never unit-scaled: a default is already the PDK's own
# number. Note PyYAML 1.1 types a dot-less `1e-05` as a STRING and `2.8e-07`
# as a float; silk treats both as the same PDK-unit number (the string is
# emitted verbatim, the float via _fmt) — see
# tests/test_pdk_defaults_are_author_units.py.
#
# What the circuit author writes is a SEPARATE setting: the manifest's
# `user_units: u` (gf180mcu.pdk.yaml) means authors write MICRONS —
#     pdk.nmos3p3('M1', ..., w=10, l=0.28)
# — and silk converts caller-supplied values to metres on emission
# (BasePDK._scale_factor: 1e-6 for `u` → `base`). Pass
# `load_pdk('gf180mcu', user_units='si')` to write metres instead.
#
# Every consumer of this geometry — netlist emission on both construction
# paths, and silk.layout's area model via basepdk.device_geometry_um — reads
# these tags through BasePDK. Nothing in silk assumes a unit for an untagged
# length; leave the tags in place.
#
# `junction_ratings:` IS NOT GENERATED. It is hand-authored: each value is
# the foundry's stated maximum operating voltage (Design Manual 14.1) and the
# `junction_ratings_provenance:` block beside it cites where, or states the
# rule a value was derived by when GF publishes none for that pair. The
# convention is written once in docs/adding-a-pdk.md ("Junction ratings") and
# `python -m silk.pdk.validate --pdk gf180mcu` enforces it (TASK-48).

nmos3p3:
  PDKDevice: nfet_03v3
  paramList:
    m:
      minval: 1
      maxval: -1
      resolution: 1
    w:
      minval: -1
      maxval: -1
      default: 1e-05
      pdk_unit: base
    l:
      minval: -1
      maxval: -1
      default: 2.8e-07
      pdk_unit: base
  pinList:
    d: drain
    g: gate
    s: source
    b: bulk
  junction_ratings:
    Vgs_max: 3.63
    Vds_max: 3.63
    Vgd_max: 3.63
    Vbs_max: 3.63
    Vbd_max: 3.63
  junction_ratings_provenance:
    source: >-
      GF180MCU Design Manual 14.1 "Chip Operating Conditions",
      https://gf180mcu-pdk.readthedocs.io/en/latest/physical_verification/design_manual/drm_14_1.html:
      14.1.4.2 "Maximum absolute value of DC voltage allowed between the gate
      and any other FET node (gate-node voltage) is 3.63V (for thin oxide)" ->
      Vgs_max, Vgd_max; 14.1.2 "nominal power supply voltage ... 3.3V for LV
      ... with a supply overshoot tolerance of 10%" -> Vds_max = 3.3 x 1.1 =
      3.63 V, corroborated by the electrical specification 1.0 (Low Voltage
      Devices), which characterizes Ioff at |Vds| = 3.63 V.
    heuristic:
      Vbs_max: >-
        = Vds_max; no body-junction operating limit is published. Body and
        source both sit within the rail, so Vbs is bounded by the same 3.3 V +
        10% supply tolerance as Vds.
      Vbd_max: >-
        = Vds_max; no separate Vbd operating limit is published. Vbd equals
        Vds with the body at source potential (the source-tied body every
        shipped example uses).
  # TASK-330.3 (save_device_params), gate finding: measured with a real
  # ngspice run (tests/fixtures/op_point/gf180mcu/ngspice{42,47}_nmos3p3_op_params.*)
  # against sm141064.ngspice's own nfet_03v3 subckt body. 14 of the 17
  # DEVICE_OP_PARAMS resolve; cgso/cgdo/cgbo are unavailable/zero-length on
  # this model and are dropped. op_internal_name is 'm0' -- this model's OWN
  # internal MOSFET instance line ('m0 d g s b nfet_03v3 ...'), NOT
  # 'm'+PDKDevice the way sky130's happens to be spelled: guessing the
  # sky130 spelling here is exactly what made every '@' reference fail
  # identically before this was measured (see
  # silk.circuit.modules_results.device_op_save_lines's docstring).
  op_params:
    [id, vgs, vds, vbs, vth, vdsat, gm, gds, gmbs, cgg, cgs, cgd, capbd, capbs]
  op_internal_name: m0
  # TASK-330.4 (op_table): channel polarity, a third per-device PDK
  # declaration -- there is no general rule from the model name alone.
  polarity: n
  # TASK-330.5: which simulator backends this device's op-point addressing
  # has been VERIFIED on by a real run. ngspice only -- gf180mcu fails to
  # even LOAD on Xyce 7.10 (a whole-PDK library-parse incompatibility in
  # sm141064.ngspice's nested .LIB/.ENDL sections and its 'statistical'/
  # 'noise_corner' sub-includes, unrelated to op columns), measured with a
  # real run: tests/fixtures/op_point/gf180mcu/xyce_probe_gf180mcu_nmos3p3.log.
  op_backends: [ngspice]
  schemdraw:
    element: NFet
    category: transistor
    terminalMap:
      d: drain
      g: gate
      s: source
      b: bulk
