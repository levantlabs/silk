# ===========================================================================
# PASSIVES, DIODES AND BIPOLARS
#
# Reachable since the manifest's corners gained per-corner `includes:` — one
# `.lib` line per device family (see gf180mcu.pdk.yaml). Everything below is
# read out of the installed PDK; the notes say which file said what.
#
# GEOMETRY DEFAULTS. The .subckt lines declare `r_length=l r_width=w` — a
# reference to global parameters `l` and `w` that GF180MCU never defines
# (design.ngspice sets only the statistical/noise switches). So the PDK's own
# stated default is "the caller must supply it", and the numbers below come
# from the next authority down: the `template=` block of that device's xschem
# symbol under libs.tech/xschem/symbols, which is the geometry GF's own
# schematics instantiate. Hence nwell's 3 µm and rm1–rm3's 0.6 µm rather than
# a blanket 1 µm.
#
# Every default below is QUOTED, and that is load-bearing rather than a style
# choice. silk scales a NUMERIC parameter from the author's unit into the
# PDK's (BasePDK._param_scales) but passes a STRING through as a literal
# already in the PDK's own unit (factory._render_param). These numbers are
# metres, so quoting them is what makes them mean the same thing under
# user_units 'u', 'si' and 'pdk' alike. Unquote one and PyYAML's typing decides
# for you: `1e-06` has no decimal point so YAML 1.1 calls it a string, while
# `1.2e-05` has one and becomes a float that then gets scaled again — 1.2e-11 m
# instead of 1.2e-5 m, silently.
#
# Seven devices (nplus_s, pplus_s, rm4, tm6k, tm9k, tm11k, tm30k) have no
# xschem symbol, so no PDK-stated default exists; each carries a comment
# saying its 1 µm square is silk's choice. A default is a convenience, not a
# constraint silk enforces — the enforced bounds are still `-1`.
#
# LIMITS. `-1` throughout, for the reason the header above gives: GF180MCU's
# drawn-geometry design rules are not in the installed tree in machine-
# readable form, and a guessed minimum is worse than none.
#
# res_rm4 IN THE `statistical` CORNER IS BROKEN, AND IT IS GF'S BUG, NOT
# SILK'S: the `res_statistical` section defines a sheet resistance for every
# resistor EXCEPT rm4, which res_typical/_ss/_ff all define. ngspice aborts
# with "Formula() error" (verified). Every other device, and res_rm4 in every
# other corner, is unaffected; res_rm4 measures 9.000 ohm at
# 1 x 100 um / typical, exactly rsh_rm4 = 0.09 ohm/sq x 100 squares.
#
# `junction_ratings:` is likewise ABSENT from every device below. It is
# enforced (silk.lint.rules.stress reads it), and GF states no per-terminal
# use ratings for these devices. The diode models do carry `bv`, but that is
# a breakdown parameter of the model, not a rated operating voltage, and
# publishing it as one would be a fabrication.
#
# RESISTOR PIN 3 is the well/substrate tie, not a body-effect terminal: each
# `.subckt` ties both ends to node 3 through a junction diode (diffusion and
# nwell resistors) or a field-oxide capacitor (poly resistors). Its direction
# is what names it here — `sub` where node 3 is the diode ANODE (p-substrate:
# nplus_u/_s, nwell) or the field-oxide plate (all poly), `nwell` where node 3
# is the CATHODE (pplus_u/_s, p+ in n-well). Pins `a` and `b` are the two ends
# and are interchangeable: rt1/rt2 use the same terminal model and the body
# resistor is symmetric.
#
# DIODES ARE `.model` CARDS, not subcircuits — so they carry
# `spice_prefix: D` and silk emits a D primitive line. Emitting them as `XM…`
# would produce an unknown-subckt bind. `area` and `pj` are the D card's own
# instance parameters, in m² and m: these are `level=3` diodes, whose `is`,
# `cjo` and `jsw` are per-area/per-length densities (that is also how the
# resistor subckts instantiate them internally, e.g. `area='r_w*r_l/2'`).
# `area` therefore declares `quantity: area`, so an author writing µm² has the
# value scaled by 1e12, not 1e6. The defaults are the xschem symbol's own
# `area = r_w*r_l`, `pj = 2*r_w + 2*r_l` evaluated at its template geometry.
#
# MOS CAP PIN ORDER: node 1 is the GATE, node 2 the well/bulk. The .subckt
# numbers them, and the symbol's pin *numbers* disagree with its file order,
# so this is settled from the model equation instead:
# `c = A*(cvar1 + cvar2*tanh(cvar3*v(1,2) + cvar4))` peaks at
# v(1,2) = -cvar4/cvar3 = +0.63 V for cap_nmos_03v3 and -0.79 V for
# cap_pmos_03v3 — i.e. capacitance is maximal when node 1 is a threshold above
# (n) or below (p) node 2, which is the gate. Confirmed by simulation on a
# 10x10 um cap_nmos_03v3: C(v(g,b) = +3.3 V) = 398.3 fF and
# C(v(g,b) = -3.3 V) = 2.3 fF, a 173.2x swing that matches the equation's own
# (cvar1+cvar2)/(cvar1-cvar2) to 0.0%.
#
# MIM CAP pins are `plus`/`minus` in .subckt order, and are interchangeable —
# the model is a single symmetric `c_cap 1 2` (plus, on the 2 fF/µm² cell, a
# symmetric leakage resistor). The three cells here are the generic names GF's
# own symbols use; the metal-stack-specific twins (cap_mim_1f5_m5m6_noshield
# and friends) are also in scope through the same include and are numerically
# identical — same c_cox, c_capsw, tc1, tc2 — so they are not duplicated here.
# ===========================================================================

res_nplus_u:
  PDKDevice: nplus_u
  paramList:
    m:
      minval: 1
      maxval: -1
      resolution: 1
    r_width:
      minval: -1
      maxval: -1
      default: 1e-06
      pdk_unit: base
    r_length:
      minval: -1
      maxval: -1
      default: 1e-06
      pdk_unit: base
  pinList:
    a: plus
    b: minus
    c: sub
  schemdraw:
    element: Resistor
    category: passive
    terminalMap:
      a: start
      b: end

