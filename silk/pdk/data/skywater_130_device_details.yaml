  junction_ratings_provenance:
    source: >-
      $PDK_ROOT/skywater-pdk/docs/rules/device-details/npn_05v0/index.rst
      ("Operating regime where SPICE models are valid"; public copy
      https://skywater-pdk.readthedocs.io/en/main/rules/device-details.html):
      |VCE| = 0 to 5.0 V, |VBE| = 0 to 5.0 V, forward-active only. The page
