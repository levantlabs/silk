nmos1p8:
  PDKDevice: sky130_fd_pr__nfet_01v8
  paramList:
    m:
      maxval: -1
      minval: 1
      resolution: 1
    w:
      maxval: -1
      minval: 0.42
      default: 1.0
      pdk_unit: u
      resolution: 0.005
    l:
      maxval: -1
      minval: 0.15
      default: 0.15
      pdk_unit: u
      resolution: 0.005
  fault_params:
    w:
      kind: continuous
      min: 0.42
      max: 100.0
    l:
      kind: continuous
      min: 0.15
      max: 100.0
  pinList:
    d: drain
    g: gate
    s: source
    b: bulk
  junction_ratings:
    Vgs_max: 1.95   # TASK-48: was 1.98 (1.1 x 1.8 V nominal, unsourced)
    Vds_max: 1.95   # TASK-48: was 1.98 (1.1 x 1.8 V nominal, unsourced)
    Vgd_max: 1.95   # TASK-48: was 1.98 (1.1 x 1.8 V nominal, unsourced)
    # TASK-91: was the magnitude 1.95 (TASK-48: was 1.98), which let a body
    # forward-biased by up to 1.95 V pass; the page's range is +0.3 to -1.95 V.
    Vbs_max: {min: -1.95, max: 0.3}
    Vbd_max: 1.95   # TASK-48: was 1.98 (1.1 x 1.8 V nominal, unsourced)
  junction_ratings_provenance:
    source: >-
      $PDK_ROOT/skywater-pdk/docs/rules/device-details/nfet_01v8/index.rst
      ("Operating Voltages where SPICE models are valid"; public copy
      https://skywater-pdk.readthedocs.io/en/main/rules/device-details.html):
      VDS 0 to 1.95 V, VGS 0 to 1.95 V, VBS +0.3 to -1.95 V. Vbs_max is the
      signed range {min: -1.95, max: 0.3} (Vbs = V(b) - V(s)): the body may
      sit at most 0.3 V above the source (forward) and 1.95 V below it.
    heuristic:
      Vgd_max: >-
        = Vds_max; no separate Vgd operating limit is published. Vgd equals
        Vds with the gate at source potential, the normal off-state, and the
        page gives no direction-specific Vgd limit, so the symmetric Vds
        range is taken for the gate above and below the drain alike (STR-001
        scores the signed pair; there is simply no published asymmetry to
        store here).
      Vbd_max: >-
        = Vds_max; no separate Vbd operating limit is published. Vbd equals
        Vds with the body at source potential (the source-tied body every
        shipped example uses).
  # TASK-330.3 (save_device_params): verified by real ngspice 42/47 runs
  # (tests/fixtures/op_point/, TASK-330.1's op_probe.sp and TASK-330.3's
  # tran_op_after17.sp) -- 14 of 17 names resolve without aborting 'write'.
  # cgso/cgdo/cgbo are DELIBERATELY EXCLUDED (TASK-330.4 gate finding,
  # 2026-09-27): BSIM4 only fills these overlap caps after a transient has
  # run in the same ngspice session -- an Op()-only, AC-only or one-point
  # DC bench reports them as a SILENT 0 (not a zero-length vector, which
  # op_table() would correctly read as nan/unavailable) even though every
  # other declared column is identical across all four analyses. Declaring
  # them would put a real number on the table that is not actually a
  # measurement, indistinguishable from a genuine near-zero overlap cap --
  # the same "never a silent zero" rule that dropped them from gf180mcu's
  # own declaration (measured unavailable there for a different reason,
  # zero-length, but the outcome -- undeclared -- is the same).
  # op_internal_name is sky130's OWN model-instance line's literal name
  # (a fact about how this model is authored, not a general rule -- see
  # modules_results.device_op_save_lines's docstring). Other sky130 MOS
  # families are declared separately only after real-run verification;
  # TASK-491 extends this to the MOS families below (not varactors).
  op_params:
    [id, vgs, vds, vbs, vth, vdsat, gm, gds, gmbs,
     cgg, cgs, cgd, capbd, capbs]
  op_internal_name: msky130_fd_pr__nfet_01v8
  # TASK-330.4 (op_table): channel polarity, a third per-device PDK
  # declaration -- there is no general rule from the model name alone.
  polarity: n
  # TASK-330.5: which simulator backends this device's op-point addressing
  # has been VERIFIED on by a real run -- a fourth per-device declaration
  # (see PDKDevice.op_backends). ngspice: the runs cited above. xyce:
  # TASK-330.1's spike (N(XDUT:XMMM1:MSKY130_FD_PR__NFET_01V8:GM) etc.,
  # tests/fixtures/op_point/xyce_probe_available.raw) plus TASK-330.5's own
  # real Op()-only Xyce end-to-end run against a silk-generated deck.
  op_backends: [ngspice, xyce]
  schemdraw:
    element: NFet
    category: transistor
    terminalMap:
      d: drain
      g: gate
      s: source
      b: bulk
