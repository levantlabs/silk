  # The signal-kind annotations metric signatures are written with. Documented
  # under their defining name so the signatures' cross-references resolve.
  - silk.signals.schema.AnySignal
  - silk.signals.schema.Transient
  - silk.signals.schema.FrequencyResponse
  - silk.signals.schema.NoiseDensity
  - silk.signals.schema.CodeTransitions
