# These classes' members get a group of their own: they are the bulk of what a
# user calls. Members of other classes are grouped as "<package> (members)".
member_groups:
  - Module
  - ModuleTestbench
  - Signal
  - Spec

# Documented instance attributes that are assigned in __init__ and so are
# invisible on the class, listed by hand because docs/api-reference.md or a
# class docstring promises them (internal instance state is not crawled).
# Keyed by class name as exported.
attributes:
  Module: [results_file]
  Signal: [x, y, name, type, xlabel, ylabel]

factories:
  - group: sky130 device factories
    label: "load_pdk('sky130')"
    call: silk.pdk.load_pdk
    args: [sky130]
  - group: ElementLibrary elements
    label: elements
    object: silk.elements.elements

# Dotted names never collected, with the reason.
exclude:
