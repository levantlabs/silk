# The public API surface of silk, for the docstring audit (scripts/docstring_audit.py)
# and, in TASK-305 Phase 2, for the generated API reference. One list, so the
# audit scores exactly what the reference will render.
#
# Collection rules (implemented by docstring_audit.collect):
# * Each package's own docstring is a module row, and every name in its
#   __all__ is on the surface. A package listed
#   here must define __all__. Packages are scored in the order listed, most
#   specific first: a name exported by several packages is scored once, under
#   the first one that lists it.
# * A module found in an __all__ is recursed into (after the current package)
#   when it is a silk module with an __all__, unless excluded below.
# * The same object exported under a second NAME is an alias row (not scored
#   again); the same name re-exported is skipped.
# * For every silk class on the surface: its public methods and properties
#   (including those defined on silk mixins and silk base classes), its data
#   fields (dataclass, pydantic, NamedTuple), and the instance attributes
#   listed under `attributes`. Members inherited from outside silk (object,
#   Enum, Exception, pydantic) are not silk's to document. Enum members are
#   documented by their enum's docstring and are not separate rows.
# * `include` names, by dotted path, symbols no __all__ exports (see below).
# * `factories` are surfaces built at run time (device classes generated from
#   catalogs); each entry names how to obtain the object whose public
#   class-valued attributes are the surface.

# Imported before collection. silk.constraints is a side-effect import: it
# attaches Module.add_constraint / Module.list_constraints.
imports:
  - silk.constraints

packages:
  - silk.metrics
  - silk.pdk
  - silk.db
  - silk.faults
  - silk.optimize
  - silk.layout
  - silk.sources
  - silk.specs
  - silk.signals
  - silk.simulation
  - silk.elements
  - silk.constraints
  - silk.codegen
  - silk.lint
  - silk.lint_markers
  - silk.exceptions
  - silk.spice_names
  # Includes validate_instance_name and validate_net_name via __all__.
  - silk.circuit
  - silk

# Symbols that docs/api-reference.md documents but no package lists in its
# __all__, by dotted path. They are collected like an exported name (a class
# brings its members), under the longest package prefix; adding a row here
# changes the audit and the generated reference, never the public API.
